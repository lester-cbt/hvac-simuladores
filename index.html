<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Superheat y Subcooling | HVAC</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--muted:#5b6878;--line:#dbe1e8;--blue:#1d63c4;--red:#c3372c;--ok:#1d7f47;--okbg:#e8f6ee;--warn:#9a6212;--warnbg:#fdf3e2;--bad:#b02a20;--badbg:#fcebea;--info:#2c4f7c;--infobg:#e9f0f9;--accent:#123f6b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:14px 18px}
.hwrap{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;padding:6px 12px;font-weight:600;cursor:pointer}
.lang button.active{background:#fff;color:var(--accent)}
nav.tabs{display:flex;gap:4px;padding:12px 14px 0;max-width:980px;margin:0 auto}
nav.tabs button{flex:1;border:1px solid var(--line);border-bottom:0;background:#e6ebf1;padding:10px 6px;border-radius:8px 8px 0 0;font-weight:600;font-size:.95rem;cursor:pointer;color:var(--muted)}
nav.tabs button.active{background:var(--card);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:0 14px 28px}
.panel{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:18px;display:none}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 14px 14px;margin:0;min-width:0}
legend{font-weight:700;padding:0 6px}
.low legend{color:var(--blue)} .high legend{color:var(--red)}
label{display:block;font-size:.88rem;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid #c3cbd5;border-radius:6px;font-size:1rem;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #8db4e8;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font-size:1.7rem;font-weight:700;margin-top:2px}
.stat .s{font-size:.82rem;color:var(--muted)}
.diag{margin-top:14px;border-radius:8px;padding:12px 14px;border-left:5px solid}
.diag h3{margin:0 0 4px;font-size:1.05rem}
.diag p{margin:4px 0}
.diag.ok{background:var(--okbg);border-color:var(--ok)} .diag.ok h3{color:var(--ok)}
.diag.add,.diag.recover{background:var(--warnbg);border-color:var(--warn)} .diag.add h3,.diag.recover h3{color:var(--warn)}
.diag.check,.diag.nocharge{background:var(--badbg);border-color:var(--bad)} .diag.check h3,.diag.nocharge h3{color:var(--bad)}
.diag.info{background:var(--infobg);border-color:var(--info)} .diag.info h3{color:var(--info)}
.note{font-size:.85rem;color:var(--muted);margin-top:12px}
details{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{font-weight:600;cursor:pointer}
details ul{margin:8px 0 2px;padding-left:20px}
.gauges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gauges figure{margin:0;text-align:center}
.gauges figcaption{font-size:.85rem;color:var(--muted)}
.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}
.reading{background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.reading .k{font-size:.8rem;color:var(--muted)}
.reading .v{font-weight:700;font-size:1.15rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:6px;padding:10px 18px;font-weight:600;font-size:1rem;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#e6ebf1;color:var(--ink)}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.choices label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0;color:var(--ink);cursor:pointer}
.choices input{width:auto}
.score{font-size:.9rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:20px;background:#e6ebf1;color:var(--ink);margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:10px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:#f0f3f7;position:sticky;top:0}
.tablewrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.hidden{display:none!important}
.mark-ok{color:var(--ok);font-weight:700}.mark-bad{color:var(--bad);font-weight:700}
footer{max-width:980px;margin:0 auto;padding:0 14px 24px;font-size:.78rem;color:var(--muted)}
@media (max-width:520px){.row2{grid-template-columns:1fr}.stat .v{font-size:1.45rem}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="lang-es" class="active" type="button">ES</button>
    <button id="lang-en" type="button">EN</button>
  </div>
</div></header>

<nav class="tabs" role="tablist">
  <button class="active" data-tab="calc" data-i18n="tabCalc" type="button"></button>
  <button data-tab="practice" data-i18n="tabPractice" type="button"></button>
  <button data-tab="pt" data-i18n="tabPT" type="button"></button>
</nav>

<main>
<!-- CALCULATOR -->
<section class="panel active" id="calc">
  <div class="grid">
    <fieldset>
      <legend data-i18n="system"></legend>
      <label for="c-ref" data-i18n="refrigerant"></label>
      <select id="c-ref"></select>
      <label for="c-meter" data-i18n="metering"></label>
      <select id="c-meter">
        <option value="txv" data-i18n="txv"></option>
        <option value="fixed" data-i18n="fixed"></option>
      </select>
      <div id="c-fixed-box" class="row2 hidden">
        <div><label for="c-iwb" data-i18n="iwb"></label><input id="c-iwb" type="number" step="0.5" value="63"></div>
        <div><label for="c-odb" data-i18n="odb"></label><input id="c-odb" type="number" step="0.5" value="85"></div>
      </div>
      <div id="c-txv-box">
        <label for="c-tsc" data-i18n="targetSC"></label><input id="c-tsc" type="number" step="0.5" value="10">
      </div>
    </fieldset>
    <fieldset class="low">
      <legend data-i18n="lowSide"></legend>
      <label for="c-sp" data-i18n="suctionP"></label><input id="c-sp" type="number" step="0.5" value="118">
      <label for="c-st" data-i18n="suctionT"></label><input id="c-st" type="number" step="0.5" value="52">
    </fieldset>
    <fieldset class="high">
      <legend data-i18n="highSide"></legend>
      <label for="c-lp" data-i18n="liquidP"></label><input id="c-lp" type="number" step="0.5" value="365">
      <label for="c-lt" data-i18n="liquidT"></label><input id="c-lt" type="number" step="0.5" value="100">
    </fieldset>
  </div>
  <div class="cards">
    <div class="stat"><div class="k" data-i18n="evapSat"></div><div class="v" id="r-esat">–</div><div class="s" data-i18n="dewNote"></div></div>
    <div class="stat"><div class="k" data-i18n="superheat"></div><div class="v" id="r-sh">–</div><div class="s" id="r-sh-t"></div></div>
    <div class="stat"><div class="k" data-i18n="condSat"></div><div class="v" id="r-csat">–</div><div class="s" data-i18n="bubNote"></div></div>
    <div class="stat"><div class="k" data-i18n="subcool"></div><div class="v" id="r-sc">–</div><div class="s" id="r-sc-t"></div></div>
  </div>
  <div id="c-diag"></div>
  <details>
    <summary data-i18n="checklistTitle"></summary>
    <ul id="checklist"></ul>
  </details>
  <p class="note" id="c-formula"></p>
</section>

<!-- PRACTICE -->
<section class="panel" id="practice">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div id="p-tags"></div>
    <div class="score" id="p-score"></div>
  </div>
  <p data-i18n="practiceIntro" style="margin:10px 0 6px"></p>
  <div class="gauges" id="p-gauges"></div>
  <div class="readings" id="p-readings"></div>
  <div class="row2">
    <div><label for="p-sh" data-i18n="yourSH"></label><input id="p-sh" type="number" step="0.5" inputmode="decimal"></div>
    <div><label for="p-sc" data-i18n="yourSC"></label><input id="p-sc" type="number" step="0.5" inputmode="decimal"></div>
  </div>
  <label data-i18n="yourDiag"></label>
  <div class="choices" id="p-choices">
    <label><input type="radio" name="p-d" value="ok"><span data-i18n="optOk"></span></label>
    <label><input type="radio" name="p-d" value="add"><span data-i18n="optAdd"></span></label>
    <label><input type="radio" name="p-d" value="recover"><span data-i18n="optRecover"></span></label>
  </div>
  <div class="btns">
    <button class="btn primary" id="p-check" type="button" data-i18n="check"></button>
    <button class="btn ghost" id="p-new" type="button" data-i18n="newCase"></button>
  </div>
  <div id="p-feedback"></div>
</section>

<!-- PT TABLE -->
<section class="panel" id="pt">
  <div class="grid">
    <fieldset>
      <legend data-i18n="ptLookup"></legend>
      <label for="t-ref" data-i18n="refrigerant"></label><select id="t-ref"></select>
      <div class="row2">
        <div><label for="t-temp" data-i18n="tempF"></label><input id="t-temp" type="number" step="1" value="40"></div>
        <div><label for="t-press" data-i18n="pressPsig"></label><input id="t-press" type="number" step="1" placeholder="psig"></div>
      </div>
      <div id="t-out" class="diag info"></div>
    </fieldset>
    <div id="t-refnote" class="note" style="margin-top:0"></div>
  </div>
  <div class="tablewrap"><table id="t-table"></table></div>
</section>
</main>
<footer id="foot"></footer>

 txvRecover:"Subcooling is {0} above target. Recover refrigerant in small amounts.",
 restriction:"High superheat and high subcooling together point to a restriction (filter drier, liquid line, metering device), not an undercharge. Don't add refrigerant.",
 lowSHtxv:"Superheat under 3 °F on a TXV system risks liquid floodback to the compressor. Check the TXV bulb (contact and insulation) and indoor airflow.",
 airflowAdd:"High superheat can also come from a high heat load. Confirm the system is stable first.",
 airflowRecover:"Low superheat can also come from low indoor airflow (dirty filter, blower speed, dirty coil). Rule that out before recovering refrigerant.",
 checklistTitle:"Before adjusting the charge",
 checklist:["Clean filter and correct indoor airflow (≈400 CFM per ton, or per manufacturer).","Clean evaporator and condenser coils.","System running at least 10–15 minutes with a call for cooling.","Outdoor temperature within the manufacturer's method range (typically 55 °F or higher).","Line temps taken within 6\" of the service valves, with the sensor insulated.","For R-410A and R-454B: always charge as liquid."],
 formula:"Fixed orifice: target superheat ≈ (3 × indoor WB − 80 − outdoor DB) ÷ 2, an approximation of the standard chart. Manufacturer values always take priority.",
 practiceIntro:"Read the gauges and thermometers. Calculate superheat and subcooling, then decide what to do with the charge.",
 yourSH:"Your superheat (°F)", yourSC:"Your subcooling (°F)", yourDiag:"Your diagnosis",
 optOk:"Charge is correct", optAdd:"Add refrigerant", optRecover:"Recover refrigerant",
 check:"Check", newCase:"New case",
 score:"Score: {0} of {1} cases correct",
 gLow:"Suction", gHigh:"Liquid line",
 rSuctionT:"Suction line temp", rLiquidT:"Liquid line temp",
 rIWB:"Indoor wet bulb", rODB:"Outdoor dry bulb", rTSC:"Target subcooling (nameplate)",
 needAll:"Fill in superheat, subcooling and your diagnosis.",
 allRight:"All correct!", someWrong:"Check the marked items and compare with the solution.",
 solution:"Step-by-step solution",
 sol1:"Saturation at {0} psig (dew) = {1} °F → Superheat = {2} − {1} = {3} °F",
 sol2:"Saturation at {0} psig (bubble) = {1} °F → Subcooling = {1} − {2} = {3} °F",
 sol3fix:"Target superheat = (3 × {0} − 80 − {1}) ÷ 2 = {2} °F",
 sol3txv:"Target subcooling (nameplate) = {0} °F",
 tolerance:"Your calculations are accepted within ±2 °F.",
 ptLookup:"Quick lookup", tempF:"Temperature (°F)", pressPsig:"Pressure (psig)",
 ptAtT:"At {0} °F: {1}", ptAtP:"At {0} psig: {1}",
 bubble:"bubble", dew:"dew", pressure:"Pressure",
 colT:"°F", colBub:"Bubble (psig)", colDew:"Dew (psig)", colP:"Pressure (psig)",
 foot:"Saturation pressures computed with CoolProp (reference equations of state), in psig at sea level. Educational tool: the manufacturer's charging method and targets always take priority."
}};

let lang = "es";
const $ = id => document.getElementById(id);
function t(k, ...a){ let s = I18N[lang][k] ?? k; a.forEach((v,i)=>{ s = s.split("{"+i+"}").join(v); }); return s; }
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const fF = n => f1(n) + " °F";

// ---------- PT helpers ----------
function satTemp(ref, psig, phase){ // phase: 'd' dew | 'b' bubble
  const a = PT[ref][phase];
  if (!isFinite(psig) || psig < a[0] || psig > a[a.length-1]) return null;
  for (let i=1;i<a.length;i++){
    if (psig <= a[i]){ const fr=(psig-a[i-1])/(a[i]-a[i-1]); return T0 + i-1 + fr; }
  }
  return null;
}
function satPress(ref, tempF, phase){
  const a = PT[ref][phase]; const x = tempF - T0;
  if (!isFinite(tempF) || x < 0 || x > a.length-1) return null;
  const i = Math.min(Math.floor(x), a.length-2), fr = x - i;
  return a[i] + fr*(a[i+1]-a[i]);
}

// ---------- Diagnosis (shared by calculator and practice) ----------
function targetSH(iwb, odb){ return (3*iwb - 80 - odb)/2; }
function diagnose(o){ // o: {meter, sh, sc, tsh, tsc}
  const r = {status:"", title:"", msgs:[]};
  if (o.meter === "fixed"){
    if (o.tsh < 5){ r.status="nocharge"; r.msgs.push(t("fixNoCharge")); return r; }
    const d = o.sh - o.tsh;
    if (d > 5 && o.sc > 15){ r.status="check"; r.msgs.push(t("restriction")); return r; }
    if (d > 5){ r.status="add"; r.msgs.push(t("fixAdd", fF(d)), t("airflowAdd")); }
    else if (d < -5){ r.status="recover"; r.msgs.push(t("fixRecover", fF(-d)), t("airflowRecover")); }
    else { r.status="ok"; r.msgs.push(t("fixOk", fF(o.tsh))); }
  } else {
    const d = o.sc - o.tsc;
    if (d > 3 && o.sh > 20){ r.status="check"; r.msgs.push(t("restriction")); return r; }
    if (d < -3){ r.status="add"; r.msgs.push(t("txvAdd", fF(-d))); }
    else if (d > 3){ r.status="recover"; r.msgs.push(t("txvRecover", fF(d))); }
    else { r.status="ok"; r.msgs.push(t("txvOk", fF(o.tsc))); }
    if (o.sh < 3) r.msgs.push(t("lowSHtxv"));
  }
  return r;
}
const STATUS_TITLE = {ok:"dOk", add:"dAdd", recover:"dRecover", check:"dCheck", nocharge:"dNoCharge"};
function diagHTML(r){
  return `<div class="diag ${r.status}"><h3>${t(STATUS_TITLE[r.status])}</h3>${r.msgs.map(m=>`<p>${m}</p>`).join("")}</div>`;
}

// ---------- Calculator ----------
function fillRefSelect(sel){ sel.innerHTML = Object.keys(PT).map(k=>`<option>${k}</option>`).join(""); }
function num(id){ const v = parseFloat($(id).value); return isFinite(v) ? v : NaN; }
function recalc(){
  const ref=$("c-ref").value, meter=$("c-meter").value;
  $("c-fixed-box").classList.toggle("hidden", meter!=="fixed");
  $("c-txv-box").classList.toggle("hidden", meter!=="txv");
  const sp=num("c-sp"), st=num("c-st"), lp=num("c-lp"), lt=num("c-lt");
  const es = satTemp(ref, sp, "d"), cs = satTemp(ref, lp, "b");
  $("r-esat").textContent = es==null ? (isNaN(sp)?"–":t("outOfRange")) : fF(es);
  $("r-csat").textContent = cs==null ? (isNaN(lp)?"–":t("outOfRange")) : fF(cs);
  const sh = (es!=null && !isNaN(st)) ? st - es : null;
  const sc = (cs!=null && !isNaN(lt)) ? cs - lt : null;
  $("r-sh").textContent = sh==null ? "–" : fF(sh);
  $("r-sc").textContent = sc==null ? "–" : fF(sc);
  let tsh=null, tsc=null;
  if (meter==="fixed"){ const iwb=num("c-iwb"), odb=num("c-odb"); if(!isNaN(iwb)&&!isNaN(odb)) tsh=targetSH(iwb,odb); }
  else { tsc = num("c-tsc"); if (isNaN(tsc)) tsc=null; }
  $("r-sh-t").textContent = tsh!=null ? t("target", fF(tsh)) : "";
  $("r-sc-t").textContent = tsc!=null ? t("target", fF(tsc)) : "";
  const ready = sh!=null && sc!=null && (meter==="fixed" ? tsh!=null : tsc!=null);
  $("c-diag").innerHTML = ready
    ? diagHTML(diagnose({meter, sh, sc, tsh, tsc}))
    : `<div class="diag info"><h3>${t("dIncomplete")}</h3></div>`;
  $("checklist").innerHTML = I18N[lang].checklist.map(x=>`<li>${x}</li>`).join("");
  $("c-formula").textContent = t("formula") + " " + REF_INFO[ref][lang];
}

// ---------- Gauges ----------
function gaugeSVG(val, max, major, minor, color, label){
  const cx=110, cy=110, r=88, A0=135, SW=270;
  const ang = v => (A0 + SW*Math.max(0,Math.min(v,max))/max) * Math.PI/180;
  const pt = (a,rr) => [cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  let s = `<svg viewBox="0 0 220 216" width="200" height="196" role="img" aria-label="${label}: ${val} psig">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r+12}" fill="#fff" stroke="${color}" stroke-width="5"/>`;
  for (let v=0; v<=max+0.001; v+=minor){
    const a=ang(v), isMaj = Math.abs(v/major - Math.round(v/major))<1e-6;
    const [x1,y1]=pt(a,r), [x2,y2]=pt(a, isMaj? r-12 : r-6);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="${isMaj?2:1}"/>`;
    if (isMaj){ const [tx,ty]=pt(a,r-24); s += `<text x="${tx}" y="${ty+4}" font-size="11" text-anchor="middle" fill="#333">${v}</text>`; }
  }
  const [nx,ny]=pt(ang(val), r-16);
  s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${color}"/>`;
  s += `<text x="${cx}" y="${cy+40}" font-size="12" text-anchor="middle" fill="#555">psig</text>`;
  s += `<text x="${cx}" y="${cy+62}" font-size="20" font-weight="700" text-anchor="middle" fill="${color}">${val}</text>`;
  return s + `</svg>`;
}

// ---------- Practice ----------
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
let P = null, score = {ok:0, n:0}, answered = false;

function genScenario(){
  for (let tries=0; tries<200; tries++){
    const ref = pick(Object.keys(PT)), meter = Math.random()<0.5 ? "fixed" : "txv";
    const fault = pick(["ok","add","recover"]);
    const evap = rnd(38,46), cond = rnd(98,118);
    let sh, sc, iwb=null, odb=null, tsh=null, tsc=null;
    if (meter==="fixed"){
      do { iwb=rnd(60,68); odb=rnd(78,95); tsh=targetSH(iwb,odb); } while (tsh < 12);
      if (fault==="ok"){ sh = Math.round(tsh) + rnd(-2,2); sc = rnd(8,12); }
      if (fault==="add"){ sh = Math.round(tsh) + rnd(10,16); sc = rnd(2,5); }
      if (fault==="recover"){ sh = Math.max(1, Math.round(tsh) - rnd(9,12)); sc = rnd(15,19); }
    } else {
      tsc = rnd(8,12);
      if (fault==="ok"){ sc = tsc + rnd(-1,1); sh = rnd(8,12); }
      if (fault==="add"){ sc = Math.max(1, tsc - rnd(6,8)); sh = rnd(14,22); }
      if (fault==="recover"){ sc = tsc + rnd(7,10); sh = rnd(6,10); }
    }
    const sp = Math.round(satPress(ref, evap, "d")), lp = Math.round(satPress(ref, cond, "b"));
    const st = evap + sh, lt = cond - sc;
    const esat = satTemp(ref, sp, "d"), csat = satTemp(ref, lp, "b");
    const shA = st - esat, scA = csat - lt;
    const dg = diagnose({meter, sh:shA, sc:scA, tsh, tsc});
    // keep only unambiguous cases: answer key must match the intended fault
    if (dg.status !== fault) continue;
    if (meter==="txv" && shA < 3) continue;
    return {ref, meter, fault, sp, lp, st, lt, iwb, odb, tsh, tsc, esat, csat, shA, scA};
  }
  return null;
}
function renderPractice(){
  if (!P) return;
  $("p-tags").innerHTML = `<span class="tag">${P.ref}</span><span class="tag">${t(P.meter)}</span>`;
  $("p-score").textContent = t("score", score.ok, score.n);
  const hiMax = 700, loMax = 300;
  $("p-gauges").innerHTML =
    `<figure>${gaugeSVG(P.sp, loMax, 50, 10, "#1d63c4", t("gLow"))}<figcaption>${t("gLow")}</figcaption></figure>` +
    `<figure>${gaugeSVG(P.lp, hiMax, 100, 20, "#c3372c", t("gHigh"))}<figcaption>${t("gHigh")}</figcaption></figure>`;
  const items = [[t("rSuctionT"), P.st+" °F"],[t("rLiquidT"), P.lt+" °F"]];
  if (P.meter==="fixed"){ items.push([t("rIWB"), P.iwb+" °F WB"],[t("rODB"), P.odb+" °F DB"]); }
  else items.push([t("rTSC"), P.tsc+" °F"]);
  $("p-readings").innerHTML = items.map(([k,v])=>`<div class="reading"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  if (answered) showFeedback(false);
}
function newCase(){
  P = genScenario(); answered = false;
  $("p-sh").value = ""; $("p-sc").value = "";
  document.querySelectorAll('input[name="p-d"]').forEach(r=>r.checked=false);
  $("p-feedback").innerHTML = "";
  renderPractice();
}
function showFeedback(count){
  const ush = parseFloat($("p-sh").value), usc = parseFloat($("p-sc").value);
  const ud = (document.querySelector('input[name="p-d"]:checked')||{}).value;
  if (!isFinite(ush) || !isFinite(usc) || !ud){
    $("p-feedback").innerHTML = `<div class="diag info"><h3>${t("needAll")}</h3></div>`; return;
  }
  const okSH = Math.abs(ush - P.shA) <= 2, okSC = Math.abs(usc - P.scA) <= 2, okD = ud === P.fault;
  const all = okSH && okSC && okD;
  if (count && !answered){ score.n++; if (all) score.ok++; answered = true; $("p-score").textContent = t("score", score.ok, score.n); }
  const mk = b => b ? `<span class="mark-ok">✓</span>` : `<span class="mark-bad">✗</span>`;
  const optKey = {ok:"optOk", add:"optAdd", recover:"optRecover"};
  const dg = diagnose({meter:P.meter, sh:P.shA, sc:P.scA, tsh:P.tsh, tsc:P.tsc});
  let h = `<div class="diag ${all?"ok":"check"}"><h3>${all?t("allRight"):t("someWrong")}</h3>`;
  h += `<p>${mk(okSH)} ${t("superheat")}: ${f1(ush)} → ${fF(P.shA)}</p>`;
  h += `<p>${mk(okSC)} ${t("subcool")}: ${f1(usc)} → ${fF(P.scA)}</p>`;
  h += `<p>${mk(okD)} ${t("yourDiag")}: ${t(optKey[ud])} → ${t(optKey[P.fault])}</p></div>`;
  h += `<details open><summary>${t("solution")}</summary><ul>`;
  h += `<li>${t("sol1", P.sp, f1(P.esat), P.st, f1(P.shA))}</li>`;
  h += `<li>${t("sol2", P.lp, f1(P.csat), P.lt, f1(P.scA))}</li>`;
  h += P.meter==="fixed" ? `<li>${t("sol3fix", P.iwb, P.odb, f1(P.tsh))}</li>` : `<li>${t("sol3txv", P.tsc)}</li>`;
  h += `</ul>${diagHTML(dg)}<p class="note">${t("tolerance")}</p></details>`;
  $("p-feedback").innerHTML = h;
}

// ---------- PT tab ----------
function renderPT(){
  const ref = $("t-ref").value, glide = REF_INFO[ref].glide || ref==="R-410A";
  $("t-refnote").textContent = REF_INFO[ref][lang];
  const T = parseFloat($("t-temp").value), Pp = parseFloat($("t-press").value);
  let out = "";
  if (isFinite(T)){
    const b = satPress(ref,T,"b"), d = satPress(ref,T,"d");
    out += `<p>${t("ptAtT", T, b==null ? t("outOfRange") : (glide ? `${f1(b)} psig (${t("bubble")}) · ${f1(d)} psig (${t("dew")})` : `${f1(b)} psig`))}</p>`;
  }
  if (isFinite(Pp)){
    const b = satTemp(ref,Pp,"b"), d = satTemp(ref,Pp,"d");
    out += `<p>${t("ptAtP", Pp, b==null ? t("outOfRange") : (glide ? `${fF(b)} (${t("bubble")}) · ${fF(d)} (${t("dew")})` : fF(b)))}</p>`;
  }
  $("t-out").innerHTML = out || "<p>–</p>";
  let h = `<thead><tr><th>${t("colT")}</th>` + (glide ? `<th>${t("colBub")}</th><th>${t("colDew")}</th>` : `<th>${t("colP")}</th>`) + `</tr></thead><tbody>`;
  for (let T2=-20; T2<=150; T2+=5){
    const i = T2 - T0;
    h += `<tr><td>${T2}</td>` + (glide ? `<td>${f1(PT[ref].b[i])}</td><td>${f1(PT[ref].d[i])}</td>` : `<td>${f1(PT[ref].b[i])}</td>`) + `</tr>`;
  }
  $("t-table").innerHTML = h + "</tbody>";
}

// ---------- Language & wiring ----------
function applyLang(l){
  lang = l; document.documentElement.lang = l;
  $("lang-es").classList.toggle("active", l==="es"); $("lang-en").classList.toggle("active", l==="en");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.title = t("title");
  $("foot").textContent = t("foot");
  recalc(); renderPractice(); renderPT();
}
fillRefSelect($("c-ref")); fillRefSelect($("t-ref"));
["c-ref","c-meter","c-iwb","c-odb","c-tsc","c-sp","c-st","c-lp","c-lt"].forEach(id => $(id).addEventListener("input", recalc));
["t-ref","t-temp","t-press"].forEach(id => $(id).addEventListener("input", renderPT));
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("active", x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id===b.dataset.tab));
}));
$("lang-es").addEventListener("click", ()=>applyLang("es"));
$("lang-en").addEventListener("click", ()=>applyLang("en"));
$("p-check").addEventListener("click", ()=>showFeedback(true));
$("p-new").addEventListener("click", newCase);
try { const q = new URLSearchParams(location.search).get("lang"); if (q==="en") lang="en"; } catch(e){}
P = genScenario();
applyLang(lang);
</script>
